<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夢N AI協力成果發表交流會｜即時回饋彈幕系統</title>
<style>
  :root{
    --desktop:#008080;
    --desktop-dark:#046666;
    --panel:#C0C0C0;
    --panel-alt:#E8E8E8;
    --white:#FFFFFF;
    --ink:#000000;
    --muted:#808080;
    --accent:#0000FF;
    --accent-dark:#000080;
    --accent-light:#1084D0;
    --danger:#FF0000;
    --warn:#FFFF00;
    --success:#00FF00;
    --success-dark:#006600;
    --font-body:"PMingLiU","MingLiU","新細明體","細明體","MS Sans Serif",Tahoma,sans-serif;
    --font-head:"PMingLiU","MingLiU","新細明體","Arial Black",Impact,sans-serif;
    --font-mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:var(--font-body);
    background-color:var(--desktop);
    background-image:
      linear-gradient(45deg, var(--desktop-dark) 25%, transparent 25%),
      linear-gradient(-45deg, var(--desktop-dark) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--desktop-dark) 75%),
      linear-gradient(-45deg, transparent 75%, var(--desktop-dark) 75%);
    background-size:4px 4px;
    background-position:0 0,0 2px,2px -2px,-2px 0px;
    color:var(--ink);
  }
  button,input{font-family:inherit;}
  *:focus-visible{outline:2px dotted #000;outline-offset:2px;}
  ::selection{background:var(--accent-dark);color:#fff;}

  @keyframes rainbow{
    0%{color:#ff0000;}17%{color:#ff8000;}33%{color:#e8c400;}
    50%{color:#00a000;}67%{color:#0040ff;}83%{color:#8000ff;}100%{color:#ff0000;}
  }
  @keyframes pulseGlow{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,0,0,.7);}
    50%{transform:scale(1.05);box-shadow:0 0 10px 2px rgba(255,0,0,.5);}
  }
  @media (prefers-reduced-motion:reduce){
    .title-line{animation:none !important;color:#000080;}
  }

  /* ========== 首頁 ========== */
  #homePage{position:absolute;inset:0;overflow-y:auto;padding:26px 14px 60px;}
  .home-inner{max-width:760px;margin:0 auto;}

  .brand-logos{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .brand-logo{height:50px;width:auto;object-fit:contain;display:block;}
  .brand-logo-dark{
    background:#000;padding:6px 14px;
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
  }
  .brand-logo-light{
    background:#fff;padding:6px 8px;
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
  }


  .home-title{text-align:center;font-weight:700;margin-bottom:4px;line-height:1.3;font-family:var(--font-head);}
  .home-title .title-line{
    display:block;
    font-size:clamp(22px,6vw,34px);
    letter-spacing:1px;
    text-shadow:2px 2px 0 #808080;
    animation:rainbow 4s linear infinite;
  }
  .home-title .title-line:nth-child(2){animation-delay:.4s;}
  .home-sub{text-align:center;font-size:14px;margin:8px 0 14px;color:var(--accent-dark);font-weight:700;}


  .hr-groove{border:none;height:4px;margin:16px 0;background:linear-gradient(to bottom,#808080 0%,#808080 50%,#fff 50%,#fff 100%);}

  .hit-counter{
    background:#000;color:var(--success);
    font-family:var(--font-mono);font-size:13px;text-align:center;
    padding:10px;margin:0 0 16px;
    border:2px solid;border-color:#808080 #fff #fff #808080;
    letter-spacing:1px;
  }

  .category-list{display:flex;flex-direction:column;gap:14px;}
  .category-card{
    width:100%;background:var(--panel);
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
  }
  .category-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(to right,var(--accent-dark),var(--accent-light));
    border:none;padding:10px 12px;cursor:pointer;
    font-family:var(--font-head);letter-spacing:1px;
  }
  .category-header:active{filter:brightness(.9);}
  .category-header .cat-arrow{font-family:var(--font-mono);}
  .category-panel{overflow:hidden;max-height:0;transition:max-height .15s linear;background:#fff;}
  .category-panel.open{max-height:2000px;}
  .class-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:2px;padding:10px;background:var(--panel-alt);
  }
  .class-btn{
    background:var(--panel);color:var(--ink);
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    padding:12px 6px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;
  }
  .class-btn:hover{background:#d0d0d0;}
  .class-btn:active{
    border-color:#808080 #fff #fff #808080;
    box-shadow:inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    transform:translate(1px,1px);
  }

  .color-squares{display:flex;justify-content:center;gap:6px;margin:20px 0 4px;flex-wrap:wrap;}
  .color-squares span{
    width:22px;height:22px;
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
  }

  /* ========== 班級互動頁 ========== */
  #classPage{position:absolute;inset:0;display:none;}
  #danmakuWall{
    position:absolute;top:0;left:0;width:100%;height:40vh;
    overflow:hidden;
    background-color:var(--desktop);
    background-image:
      linear-gradient(45deg, var(--desktop-dark) 25%, transparent 25%),
      linear-gradient(-45deg, var(--desktop-dark) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--desktop-dark) 75%),
      linear-gradient(-45deg, transparent 75%, var(--desktop-dark) 75%);
    background-size:4px 4px;
    background-position:0 0,0 2px,2px -2px,-2px 0px;
  }
  .bullet-text{
    position:absolute;white-space:nowrap;font-weight:700;
    text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
    pointer-events:none;will-change:left;
  }

  .hamburger-btn{
    position:fixed;top:10px;left:10px;z-index:65;
    background:var(--panel);
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    color:var(--ink);font-size:18px;line-height:1;font-weight:700;
    padding:5px 11px;cursor:pointer;
  }
  .hamburger-btn:active{
    border-color:#808080 #fff #fff #808080;
    box-shadow:inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    transform:translate(1px,1px);
  }
  .class-name-label{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    z-index:60;font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(to right,var(--accent-dark),var(--accent-light));
    padding:6px 16px;
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    white-space:nowrap;font-family:var(--font-head);letter-spacing:1px;
  }

  #historyWrapper{
    position:absolute;top:40vh;left:0;width:100%;height:60vh;
    overflow-y:auto;background:#fff;padding:0 0 74px;
  }
  .msg-row{display:flex;padding:8px 12px;border-bottom:1px solid #c0c0c0;}
  .msg-row:nth-child(odd){background:#fff;}
  .msg-row:nth-child(even){background:var(--panel-alt);}
  .msg-row.self{justify-content:flex-end;}
  .msg-row.other{justify-content:flex-start;}
  .msg-col{display:flex;flex-direction:column;max-width:78%;}
  .msg-row.self .msg-col{align-items:flex-end;}
  .msg-row.other .msg-col{align-items:flex-start;}
  .bubble{padding:7px 10px;font-size:13px;line-height:1.4;word-break:break-word;border:2px solid;}
  .msg-row.self .bubble{background:var(--success-dark);color:#fff;border-color:#00ff00 #003300 #003300 #00ff00;}
  .msg-row.other .bubble{background:var(--panel);color:var(--ink);border-color:#fff #808080 #808080 #fff;}
  .msg-time{font-size:10px;margin-top:2px;padding:0 2px;color:var(--muted);font-family:var(--font-mono);}

  .input-bar{
    position:fixed;left:0;bottom:0;width:100%;
    display:flex;gap:6px;padding:8px;
    background:var(--panel);
    border-top:2px solid;border-color:#fff #808080 #808080 #fff;
    z-index:80;
  }
  .input-bar input{
    flex:1;font-size:14px;padding:8px 10px;
    border:2px solid;border-color:#808080 #fff #fff #808080;
    background:#fff;color:#000;
  }
  .input-bar input::placeholder{color:var(--muted);}
  .input-bar button.send-btn{
    border:2px solid;border-color:#5555ff #000080 #000080 #5555ff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    padding:0 20px;
    background:var(--accent);color:#fff;font-weight:700;font-size:13px;
    cursor:pointer;letter-spacing:1px;
  }
  .input-bar button.send-btn:active{
    border-color:#000080 #5555ff #5555ff #000080;
    box-shadow:inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    transform:translate(1px,1px);
  }

  /* ========== 側邊欄 ========== */
  #sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none;}
  #sidebar{
    position:fixed;top:0;left:0;width:250px;height:100%;
    background:var(--panel);
    border-right:2px solid;border-color:#fff #808080 #808080 #fff;
    transform:translateX(-100%);
    transition:transform .15s linear;
    z-index:100;
    display:flex;flex-direction:column;
  }
  #sidebar.open{transform:translateX(0);}
  .sidebar-home-btn{
    flex:none;margin:12px;padding:10px;
    background:var(--panel);color:var(--ink);
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    font-weight:700;font-size:13px;cursor:pointer;text-align:center;letter-spacing:1px;
  }
  .sidebar-home-btn:active{
    border-color:#808080 #fff #fff #808080;
    box-shadow:inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    transform:translate(1px,1px);
  }
  .sidebar-nav{flex:1 1 auto;overflow-y:auto;padding:0 12px 16px;}
  .sidebar-group-title{
    font-size:12px;font-weight:700;margin:12px 0 6px;
    color:var(--accent-dark);font-family:var(--font-mono);letter-spacing:1px;
    border-bottom:1px solid #808080;padding-bottom:2px;
  }
  .sidebar-link{
    display:block;width:100%;text-align:left;background:#fff;
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    color:#000;padding:7px 9px;margin-bottom:4px;font-size:12px;cursor:pointer;
  }
  .sidebar-link:hover{background:#e8e8e8;}
  .sidebar-link.active{background:var(--accent);color:#fff;font-weight:700;border-color:#5555ff #000080 #000080 #5555ff;}
  .sidebar-export{
    flex:none;display:flex;gap:6px;padding:10px;
    background:repeating-linear-gradient(45deg,#ffff00,#ffff00 6px,#000 6px,#000 12px);
  }
  .sidebar-export-btn{
    flex:1;background:var(--panel);color:var(--ink);
    border:2px solid;border-color:#fff #808080 #808080 #fff;
    box-shadow:inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    padding:8px 4px;font-size:11px;font-weight:700;cursor:pointer;
  }
  .sidebar-export-btn:active{
    border-color:#808080 #fff #fff #808080;
    box-shadow:inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    transform:translate(1px,1px);
  }

  /* ========== RWD：電腦版（>768px） ========== */
  @media (min-width:769px){
    #danmakuWall{height:100vh;}
    #historyWrapper{display:none;}
    .input-bar{
      background:var(--panel);
      border:2px solid;border-color:#fff #808080 #808080 #fff;
      max-width:640px;left:50%;transform:translateX(-50%);
      bottom:14px;
    }
  }
</style>
<style>
  /* 入口頁：沿用主網站的復古 Windows 桌面語彙。 */
  .brand-logos{display:none !important;}
  #entryPage{position:fixed;inset:0;z-index:1000;overflow:hidden;background-color:var(--desktop);background-image:linear-gradient(45deg,var(--desktop-dark) 25%,transparent 25%),linear-gradient(-45deg,var(--desktop-dark) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--desktop-dark) 75%),linear-gradient(-45deg,transparent 75%,var(--desktop-dark) 75%);background-size:4px 4px;background-position:0 0,0 2px,2px -2px,-2px 0;font-family:var(--font-body);}
  #photoStage{position:absolute;inset:0;}
  .entry-photo{position:absolute;box-sizing:content-box;padding:8px 8px 27px;background:#d6d6d6;border:2px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 rgba(0,0,0,.48),inset -1px -1px 0 #888;object-fit:cover;opacity:0;transform:scale(.94) rotate(var(--photo-rotate));animation:entryPhoto 650ms ease-out forwards;pointer-events:none;}
  .entry-shade{position:absolute;inset:0;background:rgba(0,0,0,.16);pointer-events:none;}
  .entry-card{position:absolute;z-index:1;top:50%;left:50%;width:min(92vw,680px);transform:translate(-50%,-50%);background:var(--panel);border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #000,-1px -1px 0 #808080;color:var(--ink);}
  .entry-titlebar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:linear-gradient(to right,var(--accent-dark),var(--accent-light));color:#fff;font-family:var(--font-head);font-weight:700;font-size:clamp(17px,3vw,24px);}
  .entry-close{display:inline-grid;place-items:center;width:28px;height:26px;background:var(--panel);color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;font-family:Arial,sans-serif;font-size:22px;line-height:1;}
  .entry-content{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:32px 28px 26px;}
  .entry-icon{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#ffef00;border:2px solid #8a7900;font-family:var(--font-head);font-size:40px;font-weight:700;box-shadow:inset 2px 2px 0 #fff;}
  .entry-content .entry-note{margin:0;font-size:clamp(13px,2vw,16px);font-weight:700;line-height:1.55;color:var(--muted);}
  .entry-actions{margin-top:2px;}
  #enterSystemBtn{padding:8px 19px;background:var(--panel);color:#000;border:3px double #000;box-shadow:inset -1px -1px 0 #555,inset 1px 1px 0 #fff;font-size:18px;font-weight:700;letter-spacing:.05em;cursor:pointer;}
  #enterSystemBtn:active{border-color:#555 #fff #fff #555;box-shadow:inset 1px 1px 0 #555;transform:translate(1px,1px);}
  .entry-page-credit{position:absolute;left:0;right:0;bottom:6px;margin:0;z-index:2;text-align:center;font-size:10px;color:rgba(255,255,255,.55);pointer-events:none;}
  .entry-page-credit a{color:inherit;pointer-events:auto;text-underline-offset:2px;}
  @keyframes entryPhoto{to{opacity:.84;transform:scale(1) rotate(var(--photo-rotate));}}
  @media (max-width:560px){.entry-content{padding:24px 16px 20px;gap:11px}.entry-icon{width:45px;height:45px;font-size:31px}.entry-titlebar{font-size:17px}.entry-photo{padding:5px 5px 18px;}}
  @media (prefers-reduced-motion:reduce){.entry-photo{animation:none;opacity:.84;transform:rotate(var(--photo-rotate));}}
</style>
<style>
    /* 全站視覺主題：像素復古 Vision Board。 */

  </style>
  <style>
    /* 原創卡片介面：不使用參考範本的圖像、圖示、文案或排版。 */
    :root{--desktop:#ff4b13;--desktop-dark:#d83d0d;--panel:#f8ded5;--panel-alt:#fff0ea;--accent:#ff9f1c;--accent-dark:#172039;--accent-light:#ffbb4f;--ink:#12131a;--muted:#697181;--font-body:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;--font-head:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;}
    html,body{background:#ff4b13;color:#12131a;}
    button,input{font-family:var(--font-body);}
    #homePage{padding:44px 18px 65px;background:#ff4b13;}
    .home-inner{max-width:940px;padding:28px;background-color:#c5ccd8;background-image:linear-gradient(#9fa8b8 3px,transparent 3px),linear-gradient(90deg,#9fa8b8 3px,transparent 3px);background-size:72px 72px;border:0;box-shadow:0 15px 0 rgba(102,31,10,.36),0 20px 28px rgba(72,24,9,.35);}
    .home-title{margin-top:8px;}
    .home-title .title-line{color:#12131a;font-size:clamp(27px,5vw,48px);letter-spacing:.04em;text-shadow:none;animation:none;}
    .home-sub{color:#12131a;font-family:var(--font-body);font-size:16px;}
    .hit-counter{background:#f8ded5;color:#12131a;border:2px solid #12131a;border-radius:13px;box-shadow:4px 4px 0 #12131a;font-family:var(--font-body);}
    .category-list{gap:18px;}
    .category-card{background:#f8ded5;border:2px solid #12131a;border-radius:18px;box-shadow:6px 7px 0 #12131a;overflow:hidden;}
    .category-header{background:#f8ded5;color:#12131a;border:0;border-bottom:2px solid #12131a;padding:14px 16px;font-family:var(--font-body);font-size:17px;}
    .category-panel{background:#fff0ea;}
    .class-grid{background:transparent;gap:11px;padding:14px;}
    .class-btn,.sidebar-home-btn,.sidebar-export-btn{background:#fff0ea;color:#12131a;border:2px solid #12131a;border-radius:11px;box-shadow:4px 4px 0 #12131a;font-family:var(--font-body);transition:transform .15s,box-shadow .15s;}
    .class-btn:hover,.sidebar-home-btn:hover,.sidebar-export-btn:hover{background:#ffb118;color:#12131a;transform:translate(-1px,-1px);}
    .class-btn:active,.sidebar-home-btn:active,.sidebar-export-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #12131a;}
    .color-squares span{border:2px solid #12131a;border-radius:5px;box-shadow:2px 2px 0 #12131a;}
    #classPage{background:#ff4b13;}
    #danmakuWall{background-color:#c5ccd8;background-image:linear-gradient(#9fa8b8 3px,transparent 3px),linear-gradient(90deg,#9fa8b8 3px,transparent 3px);background-size:72px 72px;}
    .class-name-label{background:#172039;color:#fff;border:2px solid #12131a;border-radius:12px;box-shadow:4px 4px 0 #12131a;font-family:var(--font-body);}
    .hamburger-btn{background:#ffb118;border:2px solid #12131a;border-radius:11px;box-shadow:4px 4px 0 #12131a;font-family:var(--font-body);}
    .input-bar{background:#f8ded5;border:2px solid #12131a;border-radius:17px 17px 0 0;box-shadow:0 -4px 0 rgba(18,19,26,.12);}
    .input-bar input{border:2px solid #12131a;border-radius:10px;}
    .input-bar button.send-btn{background:#ff9f1c;color:#12131a;border:2px solid #12131a;border-radius:10px;box-shadow:3px 3px 0 #12131a;font-family:var(--font-body);}
    #historyWrapper{border-top:2px solid #12131a;}
    .msg-row.other .bubble{background:#fff0ea;border:2px solid #12131a;border-radius:12px;}
    .msg-row.self .bubble{background:#172039;border:2px solid #12131a;border-radius:12px;}
    #sidebar{background:#f8ded5;border-right:2px solid #12131a;box-shadow:6px 0 0 #12131a;}
    .sidebar-group-title{color:#172039;font-family:var(--font-body);}
    .sidebar-link{background:#fff0ea;border:2px solid #12131a;border-radius:9px;font-family:var(--font-body);}

    .sidebar-export{background:#c5ccd8;}
    #entryPage{background-color:#ff4b13;background-image:none;}
    .entry-shade{background:linear-gradient(135deg,rgba(255,175,47,.22),rgba(152,40,7,.12));}
    .entry-photo{padding:7px;background:#fff0ea;border:3px solid #12131a;border-radius:14px!important;box-shadow:6px 7px 0 #12131a;}
    .entry-card{width:min(92vw,720px);background:#f8ded5;border:3px solid #12131a;border-radius:22px;box-shadow:10px 11px 0 #12131a;overflow:visible;}
    .entry-card::before{content:"✦";position:absolute;top:-34px;left:-27px;color:#ffb118;font-size:65px;line-height:1;text-shadow:3px 3px 0 #12131a;}
    .entry-titlebar{background:#172039;border-radius:18px 18px 0 0;font-family:var(--font-body);padding:10px 14px;}
    .entry-close{background:#ffb118;border:2px solid #12131a;border-radius:7px;color:#12131a;}
    .entry-content{padding:34px 32px 28px;}
    .entry-icon{background:#ffb118;border:2px solid #12131a;border-radius:12px;box-shadow:4px 4px 0 #12131a;}
    .entry-content h1{font-family:var(--font-head);font-size:clamp(25px,4vw,38px);}
    .entry-content p{font-family:var(--font-body);}
    #enterSystemBtn{background:#ff9f1c;border:2px solid #12131a;border-radius:12px;box-shadow:4px 4px 0 #12131a;font-family:var(--font-body);}
    #enterSystemBtn:hover{background:#ffbd4e;}
    #enterSystemBtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #12131a;}

<style>

    var day = d.getDate();
    var hh = String(d.getHours()).padStart(2,"0");

    sidebarOverlay.style.display = "none";
  }
  document.getElementById("hamburgerBtn").addEventListener("click", openSidebar);
  sidebarOverlay.addEventListener("click", closeSidebar);

  /* ---------------- 頁面切換 ---------------- */
  var homePage = document.getElementById("homePage");
  var classPage = document.getElementById("classPage");
  var classNameLabel = document.getElementById("classNameLabel");
  var wallEl = document.getElementById("danmakuWall");
  var historyListEl = document.getElementById("historyList");

  var currentClassId = null;

  function goHome(){
    currentClassId = null;
    classPage.style.display = "none";
    homePage.style.display = "block";
  }

  function enterClass(name){
    currentClassId = name;
    homePage.style.display = "none";
    classPage.style.display = "block";
    classNameLabel.textContent = name;

    Object.keys(sidebarLinkMap).forEach(function(k){
      sidebarLinkMap[k].classList.toggle("active", k===name);
    });

    renderHistory(name);
    buildEngine(name);
  }

  function renderHistory(name){
    historyListEl.innerHTML = "";
    (messagesStore[name]||[]).forEach(appendHistoryRow);
    historyListEl.parentElement.scrollTop = historyListEl.parentElement.scrollHeight;
  }

  function appendHistoryRow(msg){
    var row = document.createElement("div");
    row.className = "msg-row " + (msg.isSelf ? "self" : "other");

    var col = document.createElement("div");
    col.className = "msg-col";

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.text;
    col.appendChild(bubble);

    var timeEl = document.createElement("div");
    timeEl.className = "msg-time";
    timeEl.textContent = formatTime(msg.ts);
    col.appendChild(timeEl);

    row.appendChild(col);
    historyListEl.appendChild(row);
  }

  /* ==================================================================
     核心：Native JS 彈幕引擎（純 setInterval 手動控制 left，60fps）
     ================================================================== */
  var engineTracks = [];      // engineTracks[trackIndex] = [bulletObj, ...]
  var engineTrackCount = 4;
  var rrPointer = 0;

  function isDesktop(){
    return window.innerWidth > 768;
  }

  function getNextMessage(classId){
    var arr = messagesStore[classId];
    if(!arr || arr.length === 0) return null;
    if(cursors[classId] === undefined) cursors[classId] = 0;
    var msg = arr[cursors[classId] % arr.length];
    cursors[classId]++;
    return msg;
  }

  // 產生 / 回收一則彈幕；reuseObj 存在時代表「回收重派」，否則為新建
  function spawnOnTrack(trackIndex, msg, reuseObj){
    if(!msg) return null;
    var wallW = wallEl.clientWidth;
    var wallH = wallEl.clientHeight;
    var trackH = wallH / engineTrackCount;
    var fontSize = Math.max(12, Math.min(18, trackH * 0.4));

    var bulletObj, el;
    if(reuseObj){
      bulletObj = reuseObj;
      el = bulletObj.el;
    } else {
      el = document.createElement("div");
      el.className = "bullet-text";
      wallEl.appendChild(el);
      bulletObj = {el: el};
    }

    el.textContent = msg.text;
    el.style.color = msg.isSelf ? "#FF00FF" : msg.color;
    el.style.fontSize = fontSize + "px";

    var jitter = (Math.random() * trackH * 0.2) - (trackH * 0.1);
    var top = trackIndex * trackH + (trackH - fontSize) / 2 + jitter;
    el.style.top = top + "px";

    // 先量測寬度
    var w = el.offsetWidth;

    // 防卡死排隊機制：找出同軌道其他子彈的最右邊界
    var maxRight = 0;
    var trackArr = engineTracks[trackIndex];
    for(var i=0;i<trackArr.length;i++){
      var b = trackArr[i];
      if(b !== bulletObj){
        var right = b.x + b.width;
        if(right > maxRight) maxRight = right;
      }
    }
    var spawnX = Math.max(wallW, maxRight + 45);

    bulletObj.x = spawnX;
    bulletObj.width = w;
    bulletObj.speed = 1.4 + Math.random() * 1.6;
    bulletObj.track = trackIndex;
    el.style.left = spawnX + "px";

    if(!reuseObj){
      engineTracks[trackIndex].push(bulletObj);
    }
    return bulletObj;
  }

  function buildEngine(classId){
    // 清空舊彈幕
    wallEl.innerHTML = "";
    engineTrackCount = isDesktop() ? 10 : 4;
    engineTracks = [];
    for(var t=0;t<engineTrackCount;t++){ engineTracks.push([]); }

    for(var t2=0;t2<engineTrackCount;t2++){
      var msg = getNextMessage(classId);
      if(msg) spawnOnTrack(t2, msg, null);
    }
  }

  // 每 16ms 手動微調座標（純 setInterval，不用 CSS Animation / WAAPI）
  setInterval(function(){
    if(!currentClassId) return;
    if(classPage.style.display === "none") return;

    for(var t=0;t<engineTrackCount;t++){
      var arr = engineTracks[t];
      for(var i=0;i<arr.length;i++){
        var b = arr[i];
        b.x -= b.speed;
        if(b.x + b.width < 0){
          // 滑出畫面：不刪除資料，回收並重新從記憶庫取下一則，送回最右側排隊
          var nextMsg = getNextMessage(currentClassId);
          if(nextMsg){
            spawnOnTrack(t, nextMsg, b);
          } else {
            // 理論上不會發生（種子資料保底），保險起見直接重置到右側
            b.x = wallEl.clientWidth;
            b.el.style.left = b.x + "px";
          }
        } else {
          b.el.style.left = b.x + "px";
        }
      }
    }
  }, 16);

  // RWD：手機 / 電腦切換（軌道數改變）時重建引擎
  var lastIsDesktop = isDesktop();
  var resizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      var nowDesktop = isDesktop();
      if(nowDesktop !== lastIsDesktop){
        lastIsDesktop = nowDesktop;
        if(currentClassId){
          buildEngine(currentClassId);
        }
      }
    }, 150);
  });

  /* ---------------- 送出留言 ---------------- */
  var msgInput = document.getElementById("msgInput");
  var sendBtn = document.getElementById("sendBtn");

  function sendMessage(){
    var text = msgInput.value.trim();
    if(!text || !currentClassId) return;

    var msg = {text: text, isSelf: true, color: "#FF00FF", ts: new Date()};
    messagesStore[currentClassId].push(msg);
    appendHistoryRow(msg);
    historyListEl.parentElement.scrollTop = historyListEl.parentElement.scrollHeight;

    rrPointer = (rrPointer + 1) % engineTrackCount;
    spawnOnTrack(rrPointer, msg, null);

    msgInput.value = "";
    updateHitCounter();
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", function(e){
    if(e.key === "Enter") sendMessage();
  });

  /* ---------------- 匯出 Word / Excel（零依賴） ---------------- */
  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");
  }

  function collectAllRows(){
    var rows = [];
    classesData.forEach(function(c){
      (messagesStore[c.name] || []).forEach(function(m){
        rows.push({cls:c.name, text:m.text, time:formatTime(m.ts)});
      });
    });
    return rows;
  }

  function downloadBlob(content, mime, filename){
    var blob = new Blob(["\ufeff" + content], {type: mime + ";charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function buildTableHtml(extraHead, extraStyle){
    var rows = collectAllRows();
    var html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
      "xmlns:x='urn:schemas-microsoft-com:office:excel' " +
      "xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'>" +
      (extraHead || "") + "</head><body>" +
      "<h3>夢的N次方策略會議-AI協力成果發表交流會 回饋紀錄</h3>" +
      "<table border='1' cellspacing='0' cellpadding='6' style='border-collapse:collapse;" + (extraStyle||"") + "'>" +
      "<tr><th>班級名稱</th><th>回饋內容</th><th>留言時間</th></tr>";
    rows.forEach(function(r){
      html += "<tr><td>" + escapeHtml(r.cls) + "</td><td>" + escapeHtml(r.text) + "</td><td>" + r.time + "</td></tr>";
    });
    html += "</table></body></html>";
    return html;
  }

  function exportWord(){
    var html = buildTableHtml("", "font-family:'Microsoft JhengHei';font-size:14px;");
    downloadBlob(html, "application/msword", "回饋紀錄.doc");
  }

  function exportExcel(){
    var extraHead = "<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>" +
      "<x:ExcelWorksheet><x:Name>回饋紀錄</x:Name>" +
      "<x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>" +
      "</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->";
    var html = buildTableHtml(extraHead, "font-size:12px;");
    downloadBlob(html, "application/vnd.ms-excel", "回饋紀錄.xls");
  }

  document.getElementById("exportWordBtn").addEventListener("click", exportWord);
  document.getElementById("exportExcelBtn").addEventListener("click", exportExcel);

  /* ---------------- 初始畫面 ---------------- */
  goHome();

})();
</script>
<script>
  /* 照片入口：使用同一資料夾的相對路徑，避免 file:// 與多視窗問題。 */
  (function () {
    "use strict";
    var photos = [
      "photo1.JPG", "photo2.JPG", "photo3.JPG", "photo4.JPG",
      "photo5.JPG", "photo6.JPG", "photo7.JPG", "photo8.JPG",
      "photo9.JPG", "photo10.JPG", "photo11.JPG", "photo12.JPG",
      "photo13.JPG", "photo14.JPG", "photo15.JPG", "photo16.jpg"
    ];
    var stage = document.getElementById("photoStage");
    var entryPage = document.getElementById("entryPage");
    var enterButton = document.getElementById("enterSystemBtn");
    var active = [];
    var nextPhoto = 0;
    var timer;
    var isEntryOpen = true;

    function photoSize() {
      return window.innerWidth < 769 ? { width: 125, height: 88 } : { width: 240, height: 160 };
    }
    // 均勻分布用的格子巡迴清單（避免照片集中在同一區塊，也讓畫面不會太空）
    var gridCols = 4;
    var gridRows = 3;
    var slotOrder = [];
    (function buildSlotOrder() {
      var idx = [];
      for (var i = 0; i < gridCols * gridRows; i++) idx.push(i);
      for (var i = idx.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      slotOrder = idx;
    })();
    var slotPointer = 0;
    function nextSlot() {
      var idx = slotOrder[slotPointer % slotOrder.length];
      slotPointer++;
      return { col: idx % gridCols, row: Math.floor(idx / gridCols) };
    }
    function getCardRect() {
      var card = document.querySelector(".entry-card");
      if (!card) return null;
      var r = card.getBoundingClientRect();
      var margin = 14;
      return { left: r.left - margin, top: r.top - margin, right: r.right + margin, bottom: r.bottom + margin };
    }
    function pickPosition(size) {
      var vw = window.innerWidth, vh = window.innerHeight;
      var cellW = vw / gridCols, cellH = vh / gridRows;
      var slot = nextSlot();
      var maxLeftInCell = Math.max(0, cellW - size.width - 16);
      var maxTopInCell = Math.max(0, cellH - size.height - 16);
      var left = slot.col * cellW + 8 + Math.random() * maxLeftInCell;
      var top = slot.row * cellH + 8 + Math.random() * maxTopInCell;
      left = Math.min(Math.max(8, left), Math.max(8, vw - size.width - 8));
      top = Math.min(Math.max(8, top), Math.max(8, vh - size.height - 8));

      var cardRect = getCardRect();
      if (cardRect) {
        var right = left + size.width, bottom = top + size.height;
        var overlaps = !(right < cardRect.left || left > cardRect.right || bottom < cardRect.top || top > cardRect.bottom);
        if (overlaps) {
          if (top + size.height / 2 < (cardRect.top + cardRect.bottom) / 2) {
            top = Math.max(8, cardRect.top - size.height - 12);
          } else {
            top = Math.min(Math.max(8, vh - size.height - 8), cardRect.bottom + 12);
          }
        }
      }
      return { left: left, top: top };
    }
    function addPhoto() {
      if (!isEntryOpen || active.length >= 5) return;
      var size = photoSize();
      var image = document.createElement("img");
      var pos = pickPosition(size);
      image.className = "entry-photo";
      image.src = photos[nextPhoto++ % photos.length];
      image.alt = "研習活動照片";
      image.width = size.width;
      image.height = size.height;
      image.loading = "eager";
      image.style.width = size.width + "px";
      image.style.height = size.height + "px";
      image.style.left = pos.left + "px";
      image.style.top = pos.top + "px";
      image.style.borderRadius = (window.innerWidth < 769 ? 11 : 16) + "px";
      image.style.setProperty("--photo-rotate", ((Math.random() * 18) - 9).toFixed(1) + "deg");
      image.onerror = function () { image.remove(); };
      stage.appendChild(image);
      active.push(image);
      window.setTimeout(function () {
        image.remove();
        active = active.filter(function (item) { return item !== image; });
      }, 6500);
    }
    function enterSystem() {
      isEntryOpen = false;
      window.clearInterval(timer);
      entryPage.style.display = "none";
      document.getElementById("homePage").focus && document.getElementById("homePage").focus();
    }
    enterButton.addEventListener("click", enterSystem, { once: true });
    [0, 400, 800, 1200].forEach(function (delay) { window.setTimeout(addPhoto, delay); });
    timer = window.setInterval(addPhoto, 1800);
  }());
</script>
</body>
